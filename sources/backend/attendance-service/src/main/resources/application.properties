<!-- 
   ==========================================================================
   📁 FILE: ./sources/backend/attendance-service/pom.xml
   📌 PURPOSE: Maven build descriptor for the attendance-service microservice.
   🔖 TRACEABILITY TAGS: [ARC-000], [REQ-012]
   📅 CREATED: 2026-08-29
   📝 NOTES: This pom.xml inherits from the parent project (membership-hub-backend) 
            and declares all required Quarkus 3.15.1 runtime and test dependencies.
   ==========================================================================
-->

<project xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 
                             https://maven.apache.org/xsd/maven-4.0.0.xsd">
    <!-- ---------------------------------------------------------------------- -->
    <!-- PARENT PROJECT (membership-hub-backend) -->
    <!-- ---------------------------------------------------------------------- -->
    <parent>
        <groupId>org.nlh4j.membershiphub</groupId>
        <artifactId>membership-hub-backend</artifactId>
        <version>1.0.0-SNAPSHOT</version>
    </parent>

    <!-- ---------------------------------------------------------------------- -->
    <!-- PROJECT METADATA -->
    <!-- ---------------------------------------------------------------------- -->
    <artifactId>attendance-service</artifactId>
    <packaging>jar</packaging>

    <!-- ---------------------------------------------------------------------- -->
    <!-- PROPERTIES -->
    <!-- ---------------------------------------------------------------------- -->
    <properties>
        <!-- Compiler settings -->
        <maven.compiler.source>17</maven.compiler.source>
        <maven.compiler.target>17</maven.compiler.target>

        <!-- Quarkus platform version -->
        <quarkus.platform.version>3.15.1</quarkus.platform.version>
        <quarkus.plugin.version>3.15.1</quarkus.plugin.version>

        <!-- Maven plugins versions -->
        <maven.compiler.plugin.version>3.13.0</maven.compiler.plugin.version>
        <maven.surefire.plugin.version>3.2.5</maven.surefire.plugin.version>
    </properties>

    <!-- ---------------------------------------------------------------------- -->
    <!-- DEPENDENCY MANAGEMENT (Quarkus BOM) -->
    <!-- ---------------------------------------------------------------------- -->
    <dependencyManagement>
        <dependencies>
            <!-- Import the Quarkus platform BOM -->
            <dependency>
                <groupId>io.quarkus</groupId>
                <artifactId>quarkus-bom</artifactId>
                <version>${quarkus.platform.version}</version>
                <type>pom</type>
                <scope>import</scope>
            </dependency>
        </dependencies>
    </dependencyManagement>

    <!-- ---------------------------------------------------------------------- -->
    <!-- RUNTIME DEPENDENCIES -->
    <!-- ---------------------------------------------------------------------- -->
    <dependencies>
        <!-- Core Quarkus runtime -->
        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-resteasy-reactive-jackson</artifactId>
        </dependency>

        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-hibernate-orm-panache</artifactId>
        </dependency>

        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-jdbc-postgresql</artifactId>
        </dependency>

        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-flyway</artifactId>
        </dependency>

        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-smallrye-reactive-messaging-kafka</artifactId>
        </dependency>

        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-hibernate-validator</artifactId>
        </dependency>

        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-smallrye-openapi</artifactId>
        </dependency>

        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-cache</artifactId>
        </dependency>

        <!-- Additional optional runtime dependencies can be added here -->
    </dependencies>

    <!-- ---------------------------------------------------------------------- -->
    <!-- TEST DEPENDENCIES -->
    <!-- ---------------------------------------------------------------------- -->
    <dependencies>
        <!-- Quarkus JUnit 5 -->
        <dependency>
            <groupId>io.quarkus</groupId>
            <artifactId>quarkus-junit5</artifactId>
            <scope>test</scope>
        </dependency>

        <!-- REST Assured for HTTP testing -->
        <dependency>
            <groupId>io.rest-assured</groupId>
            <artifactId>rest-assured</artifactId>
            <scope>test</scope>
        </dependency>

        <!-- Mockito for mocking -->
        <dependency>
            <groupId>org.mockito</groupId>
            <artifactId>mockito-core</artifactId>
            <scope>test</scope>
        </dependency>

        <!-- Testcontainers for PostgreSQL -->
        <dependency>
            <groupId>org.testcontainers</groupId>
            <artifactId>postgresql</artifactId>
            <version>1.20.4</version>
            <scope>test</scope>
        </dependency>

        <!-- Testcontainers for Kafka -->
        <dependency>
            <groupId>org.testcontainers</groupId>
            <artifactId>kafka</artifactId>
            <version>1.20.4</version>
            <scope>test</scope>
        </dependency>
    </dependencies>

    <!-- ---------------------------------------------------------------------- -->
    <!-- BUILD PLUGINS -->
    <!-- ---------------------------------------------------------------------- -->
    <build>
        <plugins>
            <!-- Maven Compiler Plugin -->
            <plugin>
                <groupId>org.apache.maven.plugins</groupId>
                <artifactId>maven-compiler-plugin</artifactId>
                <version>${maven.compiler.plugin.version}</version>
                <configuration>
                    <source>17</source>
                    <target>17</target>
                </configuration>
            </plugin>

            <!-- Quarkus Maven Plugin -->
            <plugin>
                <groupId>io.quarkus</groupId>
                <artifactId>quarkus-maven-plugin</artifactId>
                <version>${quarkus.plugin.version}</version>
                <executions>
                    <execution>
                        <goals>
                            <goal>build</goal>
                        </goals>
                    </execution>
                </executions>
            </plugin>

            <!-- Maven Surefire Plugin -->
            <plugin>
                <groupId>org.apache.maven.plugins</groupId>
                <artifactId>maven-surefire-plugin</artifactId>
                <version>${maven.surefire.plugin.version}</version>
                <configuration>
                    <systemPropertyVariables>
                        <java.util.logging.manager>org.jboss.logmanager.JBossLogManager</java.util.logging.manager>
                    </systemPropertyVariables>
                </configuration>
            </plugin>
        </plugins>
    </build>
</project>